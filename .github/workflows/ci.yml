name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A second push supersedes the first. Without this, a run that is already
# obsolete keeps a slot and reports a result nobody is waiting for.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Matches the Vercel project's runtime, so a build that passes here
          # is evidence about the build that actually ships.
          node-version: 24.x
          cache: npm

      # `npm ci` installs from the lockfile and fails if package.json has moved
      # past it, which `npm install` would quietly reconcile instead.
      - name: Install dependencies
        run: npm ci

      # The zero-warning threshold lives in the `lint` script rather than here,
      # so running it locally enforces exactly what CI enforces.
      - name: Lint
        run: npm run lint

      # `next build` type checks as part of the build; there is no separate tsc
      # step to keep in step with it.
      - name: Build
        run: npm run build
